<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">תחום התמחות - אייל שיפוצים ובנייה</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0a0c;
      --card-bg: #121216;
      --accent-gold: #d4af37;
      --accent-green: #25d366;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(212, 175, 55, 0.25);
      --font-family: 'Heebo', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.7;
      padding-bottom: 60px;
    }

    header {
      padding: 15px 5%;
      background: rgba(10, 10, 12, 0.9);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0; z-index: 1000;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-nav {
      background: transparent;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .btn-nav:hover { background: var(--accent-gold); color: #000; }

    .btn-whatsapp-nav {
      background: linear-gradient(135deg, var(--accent-green), #1ebd56);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .content-hero {
      padding: 60px 5% 40px 5%;
      max-width: 1000px;
      margin: 0 auto;
      text-align: center;
    }

    .category-badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.1);
      color: var(--accent-gold);
      border: 1px solid var(--border-color);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .content-hero h1 {
      font-size: 3rem;
      font-weight: 900;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .content-hero p.description {
      font-size: 1.15rem;
      color: var(--text-muted);
      font-weight: 300;
      margin-bottom: 35px;
      text-align: justify;
      text-align-last: center;
    }

    .highlights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 50px;
    }

    .highlight-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px;
      text-align: right;
    }

    .highlight-card h4 { color: var(--accent-gold); font-size: 1.05rem; margin-bottom: 5px; }
    .highlight-card p { color: var(--text-muted); font-size: 0.88rem; margin: 0; }

    .gallery-section { max-width: 1300px; margin: 0 auto; padding: 0 5%; }
    .gallery-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 25px; text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .gallery-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      height: 380px;
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .gallery-card:hover img { transform: scale(1.08); }

    .cta-box {
      max-width: 800px;
      margin: 60px auto 0 auto;
      background: radial-gradient(circle, var(--card-bg) 0%, rgba(10,10,12,1) 100%);
      border: 1px solid var(--accent-gold);
      border-radius: 20px;
      padding: 35px 20px;
      text-align: center;
    }

    .cta-box h3 { font-size: 1.8rem; color: var(--accent-gold); margin-bottom: 10px; }
    .cta-box p { color: var(--text-muted); margin-bottom: 20px; }

    .btn-cta {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent-gold), #b89228);
      color: #000;
      font-weight: 800;
      padding: 14px 35px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 1.05rem;
    }

    @media (max-width: 768px) {
      .content-hero h1 { font-size: 2.2rem; }
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="btn-nav">➔ חזרה לאתר הראשי</a>
    <a href="https://wa.me/972547540825" class="btn-whatsapp-nav">ייעוץ בוואטסאפ</a>
  </header>

  <section class="content-hero">
    <div class="category-badge" id="categoryBadge">תחום התמחות</div>
    <h1 id="categoryTitle">כותרת התחום</h1>
    <p class="description" id="categoryDesc">תוכן מפורט על התחום...</p>

    <div class="highlights-grid" id="highlightsGrid"></div>
  </section>

  <section class="gallery-section">
    <h2 class="gallery-title">גלריית פרויקטים שבוצעו</h2>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <div class="cta-box">
    <h3>מתכננים פרויקט בתחום זה?</h3>
    <p>צרו קשר עוד היום לקבלת יעוץ מקצועי והצעת מחיר מותאמת אישית מאייל</p>
    <a href="tel:0547540825" class="btn-cta">חייגו עכשיו: 054-7540825</a>
  </div>

  <script>
    const categoriesData = {
      luxury: {
        title: "שיפוצי יוקרה וווילות",
        badge: "תכנון וביצוע פרימיום",
        description: "שיפוצי יוקרה וווילות מורכבות דורשים שילוב מדויק בין הנדסה ברמה הגבוהה ביותר לבין ירידה לפרטים האדריכליים הקטנים ביותר. אייל מנהל ומבצע פרויקטים מקיפים הכוללים הריסה ותכנון מחדש, חיזוקי שלד, החלפת כלל תשתיות האינסטלציה והחשמל, ועבודות גמר ברמת אומנות. הדגש בפרויקטים אלו הוא על שימוש בחומרי הגלם המובילים בשוק, עבודה לפי תוכניות אדריכליות מדויקות, ועמידה בלוחות זמנים קפדניים.",
        prefix: "luxury",
        highlights: [
          { title: "ניהול פרויקט מלא", desc: "סנכרון מלא מול אדריכלים ומעצבי פנים" },
          { title: "תשתיות מתקדמות", desc: "חשמל חכם, אינסטלציה שקטה ומיזוג מרכזי" },
          { title: "רמת גמר אדריכלית", desc: "דיוק מילימטרי בריצוף, חיפויים וצבע" }
        ]
      },
      gypsum: {
        title: "עבודות גבס ותאורה נסתרת",
        badge: "עיצוב פנים ואלמנטים מיוחדים",
        description: "עבודות גבס הן הלב של העיצוב המודרני, והן מאפשרות להפוך כל חלל רגיל ליצירת אמנות ייחודית. אייל מתמחה בביצוע תקרות צפות מורכבות, נישות מוארות לטלוויזיה ולחפצי נוי, סינרי גבס למיזוג אוויר, והכנות לתאורה נסתרת ופסים מגנטיים. העבודה מתבצעת תוך שימוש בלוחות גבס איכותיים (גבס ירוק/ורוד לפי תקן), קונסטרוקציה מחוזקת וגימור שפכטל אמריקאי חלק למראה נקי ויוקרתי.",
        prefix: "gypsum",
        highlights: [
          { title: "תקרות ונישות מעוצבות", desc: "תכנון וביצוע תקרות צפות ואלמנטים דקורטיביים" },
          { title: "תאורה נסתרת ופסים", desc: "שילוב פרופילי אלומיניום, לדים ופסים מגנטיים" },
          { title: "גימור חלק ללא פגמים", desc: "שפכטל אמריקאי רב-שכבתי וליטוש מקצועי" }
        ]
      },
      bath: {
        title: "חדרי רחצה ושירותים",
        badge: "איטום היקפי וכלים סניטריים",
        description: "חדר הרחצה הוא החלל הרגיש ביותר בבית, שבו שילוב בין מים, איטום וגימור מושלם הוא קריטי לאורך שנים. אייל מתמחה בהתפרקות מלאה של חדרי רחצה ישנים, החלפת צנרת מים ודלפות לצנרת מודרנית (כגון SP/מולטיגול), ביצוע מערכות איטום תקניות בריצוף ובקירות, ועד להתקנת אינטרפוצים ניסתרים, אסלות תלויות וחיפוי אריחים בפורמט גדול.",
        prefix: "bath",
        highlights: [
          { title: "איטום יסודי בתקן", desc: "איטום חומרים צמנטיים ואוטמים מתקדמים" },
          { title: "אינסטלציה מודרנית", desc: "התקנת אינטרפוצים, נקזים נסתרים וצנרת איכותית" },
          { title: "חיפוי וריצוף מיומן", desc: "חיתוכי גרונג 45 מעלות והדבקה מדויקת" }
        ]
      },
      kitchen: {
        title: "מטבחים וחללים מרכזיים",
        badge: "מרכז הבית בעיצוב יוקרתי",
        description: "המטבח והסלון הם החללים המרכזיים שבהם מתנהלים חיי המשפחה. אייל מספק פתרונות מקיפים לשדרוג וחידוש חללים אלו, כולל התאמת תשתיות חשמל ואינסטלציה לתכניות מטבח חדשות, עבודות חיפוי קירות בשיש או פורצלן, הכנת איים מרכזיים, ופתיחת חללים (הריסת קירות תומכים בכפוף לאישור מהנדס) ליצירת חלל פתוח (Open Space) ומזמין.",
        prefix: "kitchen",
        highlights: [
          { title: "הכנת תשתיות למטבח", desc: "נקודות כוח, אינסטלציה וגז בדיוק מול חברת המטבחים" },
          { title: "חללים פתוחים (Open Space)", desc: "פירוק מחיצות, חיזוקים ואיחוד הסלון והמטבח" },
          { title: "חיפויים וריצוף גדול", desc: "עבודה עם אריחי ענק ופורצלן יוקרתי" }
        ]
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const catKey = urlParams.get('cat') || 'luxury';
    const currentCategory = categoriesData[catKey] || categoriesData.luxury;

    document.title = `${currentCategory.title} - אייל שיפוצים`;
    document.getElementById('categoryBadge').innerText = currentCategory.badge;
    document.getElementById('categoryTitle').innerText = currentCategory.title;
    document.getElementById('categoryDesc').innerText = currentCategory.description;

    const highlightsGrid = document.getElementById('highlightsGrid');
    highlightsGrid.innerHTML = '';
    currentCategory.highlights.forEach(item => {
      const card = document.createElement('div');
      card.className = 'highlight-card';
      card.innerHTML = `<h4>✓ ${item.title}</h4><p>${item.desc}</p>`;
      highlightsGrid.appendChild(card);
    });

    async function loadCategoryImages() {
      const galleryGrid = document.getElementById('galleryGrid');
      galleryGrid.innerHTML = '';

      for (let i = 1; i <= 15; i++) {
        const imageName = `${currentCategory.prefix}-${i}.jpg`;
        const exists = await checkImageExists(imageName);
        if (exists) {
          const card = document.createElement('div');
          card.className = 'gallery-card';
          card.innerHTML = `<img src="${imageName}" alt="${currentCategory.title}">`;
          galleryGrid.appendChild(card);
        }
      }

      if (galleryGrid.children.length === 0) {
        galleryGrid.innerHTML = `<p style="text-align:center; grid-column:1/-1; color: var(--text-muted); padding: 40px 0;">תמונות פרויקטים נוספות בתחום זה יעלו בקרוב!</p>`;
      }
    }

    function checkImageExists(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    window.addEventListener('DOMContentLoaded', loadCategoryImages);
  </script>
</body>
</html>
